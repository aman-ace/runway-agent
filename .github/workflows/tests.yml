name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy tabulate pytest
      - run: pytest -q
      # Proves the tool runs end to end with no API key configured.
      - run: python agent.py data/sample_transactions.csv --provider none
      - run: python agent.py data/sample_transactions.csv --provider none -o /tmp/smoke.html
